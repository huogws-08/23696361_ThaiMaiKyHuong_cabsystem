openapi: 3.0.3

info:
  title: Cab System Microservice API Specification
  version: 1.0.0
  description: Tài liệu RESTful API chuẩn OpenAPI dành cho hệ thống đặt xe (Cab System).

servers:
  - url: https://api.cabsystem.example.com/v1
    description: Production Server

tags:
  - name: 1. User & Authentication Service
    description: Đăng ký, Đăng nhập và Quản lý thông tin cá nhân

  - name: 2. Booking & Trip Service
    description: Đặt xe, Theo dõi, Lịch sử và Đánh giá chuyến đi

  - name: 3. Driver & Vehicle Service
    description: Hồ sơ tài xế, Quản lý phương tiện, Trạng thái và Vị trí GPS

  - name: 4. Matching Service
    description: Tìm, Phân công và Xử lý phản hồi từ tài xế

  - name: 5. Pricing & Payment Service
    description: Tính cước phí, Thanh toán tiền mặt / điện tử và Giao dịch

  - name: 6. Notification Service
    description: Gửi thông báo Push và Quản lý kênh thông báo FCM

  - name: 7. Admin & Operations Service
    description: Quản trị hệ thống, Phân quyền và Báo cáo thống kê

paths:
  /auth/register:
    $ref: "./auth.yaml#/paths/~1auth~1register"
  /auth/login:
    $ref: "./auth.yaml#/paths/~1auth~1login"
  /users/me:
    $ref: "./auth.yaml#/paths/~1users~1me"

  /bookings:
    $ref: "./booking.yaml#/paths/~1bookings"
  /trips/{trip_id}/track:
    $ref: "./booking.yaml#/paths/~1trips~1{trip_id}~1track"
  /trips/history:
    $ref: "./booking.yaml#/paths/~1trips~1history"
  /trips/{trip_id}:
    $ref: "./booking.yaml#/paths/~1trips~1{trip_id}"
  /trips/{trip_id}/rating:
    $ref: "./booking.yaml#/paths/~1trips~1{trip_id}~1rating"

  /driver/profile:
    $ref: "./driver.yaml#/paths/~1driver~1profile"
  /driver/vehicle:
    $ref: "./driver.yaml#/paths/~1driver~1vehicle"
  /driver/status:
    $ref: "./driver.yaml#/paths/~1driver~1status"
  /driver/gps:
    $ref: "./driver.yaml#/paths/~1driver~1gps"
  /driver/requests/respond:
    $ref: "./driver.yaml#/paths/~1driver~1requests~1respond"

  /matching/find-drivers:
    $ref: "./matching.yaml#/paths/~1matching~1find-drivers"
  /matching/assign:
    $ref: "./matching.yaml#/paths/~1matching~1assign"
  /matching/respond:
    $ref: "./matching.yaml#/paths/~1matching~1respond"
  /matching/timeout-handler:
    $ref: "./matching.yaml#/paths/~1matching~1timeout-handler"

  /pricing/estimate:
    $ref: "./payment.yaml#/paths/~1pricing~1estimate"
  /payments/cash:
    $ref: "./payment.yaml#/paths/~1payments~1cash"
  /payments/e-wallet:
    $ref: "./payment.yaml#/paths/~1payments~1e-wallet"
  /payments/webhook:
    $ref: "./payment.yaml#/paths/~1payments~1webhook"

  /notifications/customer:
    $ref: "./notification.yaml#/paths/~1notifications~1customer"
  /notifications/driver:
    $ref: "./notification.yaml#/paths/~1notifications~1driver"
  /notifications/channels:
    $ref: "./notification.yaml#/paths/~1notifications~1channels"

  /admin/customers:
    $ref: "./admin.yaml#/paths/~1admin~1customers"
  /admin/drivers:
    $ref: "./admin.yaml#/paths/~1admin~1drivers"
  /admin/trips:
    $ref: "./admin.yaml#/paths/~1admin~1trips"
  /admin/transactions:
    $ref: "./admin.yaml#/paths/~1admin~1transactions"
  /admin/roles:
    $ref: "./admin.yaml#/paths/~1admin~1roles"
  /admin/reports/analytics:
    $ref: "./admin.yaml#/paths/~1admin~1reports~1analytics"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
