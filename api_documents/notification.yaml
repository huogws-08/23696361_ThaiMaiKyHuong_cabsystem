openapi: 3.0.3

info:
  title: Cab System - Notification Service API
  version: 1.0.0
  description: API gửi thông báo cho khách hàng và tài xế của hệ thống Cab System.

servers:
  - url: https://api.cabsystem.example.com/v1
    description: Production Server

tags:
  - name: 6. Notification Service
    description: Gửi Push Notification cho khách hàng và tài xế.

paths:
  /notifications/customer:
    post:
      tags:
        - 6. Notification Service
      summary: Thông báo khách hàng
      description: Gửi Push Notification tới ứng dụng khách hàng.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - title
                - message
              properties:
                user_id:
                  type: string
                  example: USER-001
                title:
                  type: string
                  example: "Tài xế đã đến"
                message:
                  type: string
                  example: "Tài xế đang chờ bạn tại điểm đón."
      responses:
        "200":
          description: Gửi thông báo thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực

  /notifications/driver:
    post:
      tags:
        - 6. Notification Service
      summary: Thông báo tài xế
      description: Gửi Push Notification tới ứng dụng tài xế.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - title
                - message
              properties:
                user_id:
                  type: string
                  example: DRIVER-001
                title:
                  type: string
                  example: "Có yêu cầu chuyến mới"
                message:
                  type: string
                  example: "Bạn có một yêu cầu chuyến mới."
      responses:
        "200":
          description: Gửi thông báo thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
