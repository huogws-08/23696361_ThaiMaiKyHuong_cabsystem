openapi: 3.0.3

info:
  title: Cab System Microservice API Specification
  version: 1.0.0
  description: Tài liệu RESTful API chuẩn OpenAPI dành cho hệ thống đặt xe (Cab System).

servers:
  - url: https://api.cabsystem.example.com/v1
    description: Production Server

tags:
  - name: 1. User & Authentication Service
    description: Đăng ký, Đăng nhập và Quản lý thông tin cá nhân

  - name: 2. Booking & Trip Service
    description: Đặt xe, Theo dõi, Lịch sử và Đánh giá chuyến đi

  - name: 3. Driver & Vehicle Service
    description: Hồ sơ tài xế, Quản lý phương tiện, Trạng thái và Vị trí GPS

  - name: 4. Matching Service
    description: Tìm, Phân công và Xử lý phản hồi từ tài xế

  - name: 5. Pricing & Payment Service
    description: Tính cước phí, Thanh toán tiền mặt / điện tử và Giao dịch

  - name: 6. Notification Service
    description: Gửi thông báo Push và Quản lý kênh thông báo FCM

  - name: 7. Admin & Operations Service
    description: Quản trị hệ thống, Phân quyền và Báo cáo thống kê

paths:

  /auth/register:
    post:
      tags:
        - 1. User & Authentication Service
      summary: Đăng ký tài khoản
      description: Đăng ký tài khoản mới cho Khách hàng hoặc Tài xế.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - password
                - full_name
                - role
              properties:
                phone_number:
                  type: string
                  example: "+84901234567"
                password:
                  type: string
                  format: password
                  example: "Password123!"
                full_name:
                  type: string
                  example: "Nguyen Van A"
                role:
                  type: string
                  enum:
                    - CUSTOMER
                    - DRIVER
                  example: CUSTOMER
      responses:
        '201':
          description: Đăng ký thành công
        '400':
          description: Dữ liệu không hợp lệ
        '409':
          description: Số điện thoại đã tồn tại

  /auth/login:
    post:
      tags:
        - 1. User & Authentication Service
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - password
              properties:
                phone_number:
                  type: string
                  example: "+84901234567"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
        '401':
          description: Sai số điện thoại hoặc mật khẩu

  /users/me:
    get:
      tags:
        - 1. User & Authentication Service
      summary: Xem thông tin cá nhân
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Trả về thông tin cá nhân
        '401':
          description: Chưa xác thực

    put:
      tags:
        - 1. User & Authentication Service
      summary: Cập nhật thông tin cá nhân
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Nguyen Van B"
                phone_number:
                  type: string
                  example: "+84901234567"
      responses:
        '200':
          description: Cập nhật thông tin thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực


  /bookings:
    post:
      tags:
        - 2. Booking & Trip Service
      summary: Đặt xe
      description: Khách hàng tạo yêu cầu đặt xe.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup_location
                - dropoff_location
                - vehicle_type
              properties:
                pickup_location:
                  type: object
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                      example: "123 Le Loi, Q1, HCM"
                    latitude:
                      type: number
                      format: double
                      example: 10.7769
                    longitude:
                      type: number
                      format: double
                      example: 106.7009

                dropoff_location:
                  type: object
                  required:
                    - address
                    - latitude
                    - longitude
                  properties:
                    address:
                      type: string
                      example: "456 Nguyen Hue, Q1, HCM"
                    latitude:
                      type: number
                      format: double
                      example: 10.7740
                    longitude:
                      type: number
                      format: double
                      example: 106.7030

                vehicle_type:
                  type: string
                  enum:
                    - BIKE
                    - CAR_4S
                    - CAR_7S
                  example: BIKE
      responses:
        '201':
          description: Khởi tạo đơn đặt xe thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực


  /trips/{trip_id}/track:
    get:
      tags:
        - 2. Booking & Trip Service
      summary: Theo dõi chuyến
      description: Theo dõi trạng thái chuyến đi và vị trí tài xế.
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
          example: TRIP-001
      responses:
        '200':
          description: Trạng thái chuyến đi và tọa độ tài xế thời gian thực
        '401':
          description: Chưa xác thực
        '404':
          description: Không tìm thấy chuyến đi

  /trips/history:
    get:
      tags:
        - 2. Booking & Trip Service
      summary: Lịch sử chuyến
      description: Danh sách các chuyến đi đã hoàn thành hoặc đã hủy.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách lịch sử chuyến đi
        '401':
          description: Chưa xác thực

  /trips/{trip_id}:
    get:
      tags:
        - 2. Booking & Trip Service
      summary: Chi tiết chuyến
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
          example: TRIP-001
      responses:
        '200':
          description: Thông tin chi tiết toàn bộ chuyến đi
        '401':
          description: Chưa xác thực
        '404':
          description: Không tìm thấy chuyến đi

  /trips/{trip_id}/rating:
    post:
      tags:
        - 2. Booking & Trip Service
      summary: Đánh giá tài xế
      description: Khách hàng đánh giá tài xế sau khi chuyến đi hoàn thành.
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
          example: TRIP-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                feedback:
                  type: string
                  example: "Tài xế lái xe an toàn, vui vẻ."
      responses:
        '200':
          description: Gửi đánh giá thành công
        '400':
          description: Dữ liệu đánh giá không hợp lệ
        '401':
          description: Chưa xác thực


  /driver/profile:
    get:
      tags:
        - 3. Driver & Vehicle Service
      summary: Hồ sơ tài xế
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin bằng lái, chứng minh thư và điểm đánh giá
        '401':
          description: Chưa xác thực

    put:
      tags:
        - 3. Driver & Vehicle Service
      summary: Cập nhật hồ sơ tài xế
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Nguyen Van B"
                license_number:
                  type: string
                  example: "B2-123456789"
                identification_number:
                  type: string
                  example: "079123456789"
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực

  /driver/vehicle:
    get:
      tags:
        - 3. Driver & Vehicle Service
      summary: Thông tin phương tiện
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin xe, biển số và loại xe
        '401':
          description: Chưa xác thực

    put:
      tags:
        - 3. Driver & Vehicle Service
      summary: Cập nhật phương tiện
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_type
                - license_plate
              properties:
                vehicle_type:
                  type: string
                  enum:
                    - BIKE
                    - CAR_4S
                    - CAR_7S
                  example: CAR_4S
                license_plate:
                  type: string
                  example: "59A-12345"
                brand:
                  type: string
                  example: "Toyota"
      responses:
        '200':
          description: Cập nhật thông tin xe thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực

  /driver/status:
    patch:
      tags:
        - 3. Driver & Vehicle Service
      summary: Trạng thái hoạt động
      description: Tài xế bật hoặc tắt trạng thái sẵn sàng nhận chuyến.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - READY
                    - NOT_READY
                  example: READY
      responses:
        '200':
          description: Cập nhật trạng thái hoạt động thành công
        '400':
          description: Trạng thái không hợp lệ
        '401':
          description: Chưa xác thực

  /driver/gps:
    post:
      tags:
        - 3. Driver & Vehicle Service
      summary: Cập nhật vị trí GPS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: double
                  example: 10.7769
                longitude:
                  type: number
                  format: double
                  example: 106.7009
                heading:
                  type: number
                  format: double
                  example: 180.0
      responses:
        '200':
          description: Đã ghi nhận tọa độ mới
        '400':
          description: Tọa độ không hợp lệ
        '401':
          description: Chưa xác thực

  /driver/requests/respond:
    post:
      tags:
        - 3. Driver & Vehicle Service
      summary: Phản hồi yêu cầu chuyến
      description: Tài xế chấp nhận hoặc từ chối chuyến được phân công.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - action
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                action:
                  type: string
                  enum:
                    - ACCEPT
                    - REJECT
                  example: REJECT
                reason:
                  type: string
                  example: "Xe bị hỏng hóc đột xuất"
      responses:
        '200':
          description: Đã ghi nhận phản hồi của tài xế
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực


  /matching/find-drivers:
    post:
      tags:
        - 4. Matching Service
      summary: Tìm tài xế
      description: Tìm các tài xế khả dụng xung quanh vị trí đón.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
                - vehicle_type
              properties:
                latitude:
                  type: number
                  format: double
                  example: 10.7769
                longitude:
                  type: number
                  format: double
                  example: 106.7009
                vehicle_type:
                  type: string
                  enum:
                    - BIKE
                    - CAR_4S
                    - CAR_7S
                  example: BIKE
      responses:
        '200':
          description: Danh sách các tài xế khả dụng xung quanh vị trí đón
        '400':
          description: Dữ liệu không hợp lệ

  /matching/assign:
    post:
      tags:
        - 4. Matching Service
      summary: Phân công tài xế
      description: Phân công chuyến đi cho tài xế phù hợp nhất.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - driver_id
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                driver_id:
                  type: string
                  example: DRIVER-001
      responses:
        '200':
          description: Đã phát yêu cầu chuyến đi đến tài xế phù hợp nhất
        '400':
          description: Dữ liệu không hợp lệ

  /matching/respond:
    post:
      tags:
        - 4. Matching Service
      summary: Xử lý từ chối từ tài xế
      description: Ghi nhận việc tài xế từ chối và chuyển sang tìm tài xế khác.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - driver_id
                - action
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                driver_id:
                  type: string
                  example: DRIVER-001
                action:
                  type: string
                  enum:
                    - REJECT
                  example: REJECT
                reason:
                  type: string
                  example: "Không thể nhận chuyến"
      responses:
        '200':
          description: Đã ghi nhận phản hồi và chuyển sang tìm tài xế khác
        '400':
          description: Dữ liệu không hợp lệ

  /matching/timeout-handler:
    post:
      tags:
        - 4. Matching Service
      summary: Xử lý không phản hồi
      description: Tự động hủy lệnh phân công cũ và tìm tài xế tiếp theo khi tài xế không phản hồi.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - driver_id
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                driver_id:
                  type: string
                  example: DRIVER-001
      responses:
        '200':
          description: Đã xử lý timeout và tiếp tục tìm tài xế
        '400':
          description: Dữ liệu không hợp lệ


  /pricing/estimate:
    post:
      tags:
        - 5. Pricing & Payment Service
      summary: Tính cước
      description: Tính cước phí dựa trên khoảng cách, loại phương tiện và điều kiện giá hiện hành.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - distance_km
                - vehicle_type
              properties:
                distance_km:
                  type: number
                  format: double
                  minimum: 0
                  example: 5.2
                vehicle_type:
                  type: string
                  enum:
                    - BIKE
                    - CAR_4S
                    - CAR_7S
                  example: BIKE
      responses:
        '200':
          description: Số tiền cước tính toán
        '400':
          description: Dữ liệu không hợp lệ

  /payments/cash:
    post:
      tags:
        - 5. Pricing & Payment Service
      summary: Thanh toán tiền mặt
      description: Xác nhận thanh toán tiền mặt cho chuyến đi.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - amount
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                amount:
                  type: number
                  format: double
                  example: 75000
      responses:
        '200':
          description: Xác nhận thanh toán tiền mặt thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực

  /payments/e-wallet:
    post:
      tags:
        - 5. Pricing & Payment Service
      summary: Thanh toán điện tử
      description: Thanh toán thông qua nhà cung cấp dịch vụ thanh toán bên ngoài.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - amount
              properties:
                trip_id:
                  type: string
                  example: TRIP-001
                amount:
                  type: number
                  format: double
                  example: 75000
      responses:
        '200':
          description: Trả về thông tin thanh toán hoặc đường dẫn thanh toán
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực

  /payments/webhook:
    post:
      tags:
        - 5. Pricing & Payment Service
      summary: Xử lý giao dịch từ cổng thanh toán
      description: Nhận callback hoặc webhook từ nhà cung cấp thanh toán bên ngoài.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transaction_id
                - status
              properties:
                transaction_id:
                  type: string
                  example: TXN-001
                status:
                  type: string
                  enum:
                    - SUCCESS
                    - FAILED
                  example: SUCCESS
                provider_transaction_id:
                  type: string
                  example: PROVIDER-TXN-123
      responses:
        '200':
          description: Cập nhật trạng thái giao dịch thành công
        '400':
          description: Dữ liệu webhook không hợp lệ


  /notifications/customer:
    post:
      tags:
        - 6. Notification Service
      summary: Thông báo khách hàng
      description: Gửi Push Notification tới ứng dụng khách hàng.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - title
                - message
              properties:
                user_id:
                  type: string
                  example: USER-001
                title:
                  type: string
                  example: "Tài xế đã đến"
                message:
                  type: string
                  example: "Tài xế đang chờ bạn tại điểm đón."
      responses:
        '200':
          description: Gửi thông báo thành công

  /notifications/driver:
    post:
      tags:
        - 6. Notification Service
      summary: Thông báo tài xế
      description: Gửi Push Notification tới ứng dụng tài xế.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - title
                - message
              properties:
                user_id:
                  type: string
                  example: DRIVER-001
                title:
                  type: string
                  example: "Có yêu cầu chuyến mới"
                message:
                  type: string
                  example: "Bạn có một yêu cầu chuyến mới."
      responses:
        '200':
          description: Gửi thông báo thành công

  /notifications/channels:
    post:
      tags:
        - 6. Notification Service
      summary: Đăng ký FCM Token
      description: Đăng ký Token thiết bị để nhận Push Notification.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_token
                - platform
              properties:
                device_token:
                  type: string
                  example: "fcm_token_123456789"
                platform:
                  type: string
                  enum:
                    - ANDROID
                    - IOS
                  example: ANDROID
      responses:
        '200':
          description: Đăng ký Token thiết bị thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa xác thực


  /admin/customers:
    get:
      tags:
        - 7. Admin & Operations Service
      summary: Quản lý khách hàng
      description: Xem danh sách và trạng thái tài khoản khách hàng.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách khách hàng
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền quản trị

  /admin/drivers:
    get:
      tags:
        - 7. Admin & Operations Service
      summary: Quản lý tài xế
      description: Xem danh sách, duyệt hồ sơ và khóa tài xế.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách tài xế
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền quản trị

  /admin/trips:
    get:
      tags:
        - 7. Admin & Operations Service
      summary: Quản lý chuyến đi
      description: Tra cứu và quản lý toàn bộ chuyến đi trên hệ thống.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách chuyến đi
        '401':
          description: Chưa xác thực
        '403':
